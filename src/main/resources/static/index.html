<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Futuro Neon</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo">Tech<span>Store</span></a>
            <ul class="navbar-links" id="nav-links">
                <li><a href="#" class="active">Catálogo</a></li>
                <li><a href="#" onclick="verCarrito()" class="cart-badge" id="carritoBadge" data-count="0">🛒 Carrito</a></li>
                <li><a href="#" onclick="verPedidos()">📦 Mis Pedidos</a></li>
                <li><span id="userName" style="color:var(--primary); font-weight:bold; margin-right:1rem;"></span></li>
                <li><button id="btnLogin" class="btn btn-sm btn-outline" onclick="mostrarLogin()">Iniciar Sesión</button></li>
                <li><button id="btnRegister" class="btn btn-sm btn-primary" onclick="mostrarRegistro()">Registrarse</button></li>
                <li><button id="btnLogout" class="btn-logout" onclick="cerrarSesion()" style="display:none;">Salir</button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Buscador -->
        <div class="search-bar">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar productos por nombre..." onkeyup="if(event.key==='Enter') buscarProductos()">
            <button class="btn btn-primary" onclick="buscarProductos()">Buscar</button>
            <select id="categoriaFilter" class="form-control" onchange="filtrarPorCategoria()">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <!-- Catálogo Grid -->
        <div id="productosGrid" class="product-grid">
            <!-- Productos cargados por app.js -->
        </div>

        <!-- Panel Admin (Solo visible si es ADMIN) -->
        <div id="adminSection" class="card" style="display:none; margin-top: 2rem; padding: 1.5rem;">
            <div class="page-header">
                <h1>Panel de Administración</h1>
            </div>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Iniciar Sesión</h2>
                <button class="modal-close" onclick="cerrarLogin()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-login" onsubmit="login(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="admin@ecommerce.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="admin123" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Registro -->
    <div id="registroModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Crear Cuenta</h2>
                <button class="modal-close" onclick="cerrarRegistro()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-registro" onsubmit="registrar(event)">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="regNombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="regPassword" class="form-control" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="regDireccion" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="regTelefono" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-secondary btn-block">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Carrito -->
    <div id="carritoModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Tu Carrito</h2>
                <button class="modal-close" onclick="cerrarCarrito()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="carritoItems" class="cart-items">
                    <!-- Items del carrito -->
                </div>
            </div>
            <div class="modal-footer" style="justify-content: space-between; align-items: center;">
                <div>
                    <span style="color:var(--text-dim); font-size:0.9rem;">Total:</span>
                    <strong style="color:var(--primary); font-size:1.5rem; margin-left:10px;">S/ <span id="carritoTotal">0.00</span></strong>
                </div>
                <div>
                    <button class="btn btn-danger" onclick="vaciarCarrito()">Vaciar</button>
                    <button class="btn btn-success" onclick="realizarPedido()">Confirmar Compra</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pedidos -->
    <div id="pedidosModal" class="modal-overlay hidden">
        <div class="modal" style="max-width:700px;">
            <div class="modal-header">
                <h2>Mis Pedidos</h2>
                <button class="modal-close" onclick="cerrarPedidos()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="pedidosList" class="orders-list">
                    <!-- Pedidos cargados aquí -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
