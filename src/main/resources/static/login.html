<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - E-Commerce</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-logo">Tech<span>Store</span></a>
            <ul class="navbar-links" id="nav-links"></ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div id="alert-container"></div>
            <h1>Iniciar Sesion</h1>
            <p class="subtitle">Ingresa tus credenciales para acceder</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" class="form-control" placeholder="Tu contrasena" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-submit">Ingresar</button>
            </form>
            <div class="auth-footer">
                No tienes cuenta? <a href="registro.html">Registrate aqui</a>
            </div>
            <div style="margin-top:1.5rem;padding:1rem;background:var(--gray-50);border-radius:var(--radius);font-size:0.8rem;color:var(--gray-500)">
                <strong>Demo Admin:</strong> admin@ecommerce.com / admin123<br>
                <strong>Demo Cliente:</strong> Registrate uno nuevo
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.textContent = 'Ingresando...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    setAuthData(data);
                    if (data.rol === 'ADMIN') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    mostrarAlerta(data.mensaje || 'Credenciales invalidas', 'danger');
                }
            } catch (err) {
                mostrarAlerta('Error de conexion con el servidor', 'danger');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        });
    </script>
</body>
</html>
